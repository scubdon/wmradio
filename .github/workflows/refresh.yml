name: Refresh & deploy

on:
  schedule:
    # Every eight hours, so "Recently played" is never more than a shift stale.
    # 10:00 UTC ≈ 6am ET keeps the original slot, just after the overnight
    # blocks; the other two land around early afternoon and late evening ET.
    # The only per-run cost is shipping the ~78MB database out of GCS and back,
    # about a cent a time — three a day is noise, hourly would not be.
    - cron: "0 2,10,18 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    # This job commits new artwork thumbs and YouTube links back to main.
    # Pushes made with the default GITHUB_TOKEN don't trigger workflows, so that
    # can't loop today — but ignoring the paths it writes keeps that true even
    # if the token is ever swapped for a PAT. The next scheduled run rebuilds
    # the site from those files anyway, so skipping the push costs a few hours
    # on a play button, not a stale page.
    paths-ignore:
      - "artwork/artwork_small/**"
      - "youtube/links.tsv"

permissions:
  contents: write
  pages: write
  id-token: write

# The job downloads the canonical database, edits it, and uploads it again, so
# two runs overlapping would silently lose one run's plays. Queue instead.
concurrency:
  group: refresh-and-deploy
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    # A run that stalls before a runner is even assigned holds the concurrency
    # group, and GitHub then cancels every later run while it is still pending —
    # which has twice left a merge unpublished until the next cron picked it up.
    # A full run takes a minute or two, so this only ever fires on a stall, and a
    # stalled run self-clears instead of blocking the queue.
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so the rebase below has a merge base to work from.
          # It costs nothing here: the whole repo is ~18MB, most of which is the
          # artwork a shallow checkout would fetch anyway.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install duckdb requests yt-dlp

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Download canonical DuckDB
        run: |
          mkdir -p data
          gcloud storage cp gs://wmradio-metadata/db/radio_plays.duckdb data/radio_plays.duckdb

      - name: Ingest new plays
        run: python scripts/update_duckdb.py --skip-csv

      - name: Fetch artwork for new songs
        run: python scripts/fetch_artwork.py || echo "artwork fetch failed; continuing"

      - name: Upload refreshed DuckDB
        run: gcloud storage cp data/radio_plays.duckdb gs://wmradio-metadata/db/radio_plays.duckdb

      # Only songs missing from youtube/links.tsv are searched, which after the
      # first backfill is the handful the station has just started playing. The
      # cap is there for the case where the file is lost or truncated: a run
      # that would otherwise sit through 2,000 searches does 40 and the next
      # one continues. YouTube throttles datacentre IPs, so this is allowed to
      # fail — an unresolved song shows a search link, not a broken page.
      - name: Resolve YouTube links for new songs
        run: python scripts/fetch_youtube.py --limit 40 || echo "youtube resolve failed; continuing"

      - name: Build site data
        run: python dashboard/build.py

      - name: Commit any new artwork thumbs and YouTube links
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artwork/artwork_small youtube/links.tsv
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          git commit -m "Artwork and YouTube link additions"
          # A merge landing on main mid-run makes this push a non-fast-forward
          # and would fail the job with the refreshed database already uploaded.
          # Nothing else in this job touches tracked files, so replaying this
          # commit on top of whatever arrived is always safe.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push rejected (attempt $attempt) — rebasing onto main and retrying."
            git pull --rebase origin main
          done
          echo "Could not push artwork thumbs after 3 attempts."
          exit 1

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/site

      - id: deployment
        uses: actions/deploy-pages@v4
